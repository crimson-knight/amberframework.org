name: Sync release notes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: release-notes-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Refresh the public release snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: crystal run scripts/sync_github_releases.cr

      - name: Publish a changed snapshot
        run: |
          if git diff --quiet -- config/github_releases.json; then
            echo "Release notes are already current."
            exit 0
          fi
          git config user.name "amberframework-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/github_releases.json
          git commit -m "docs: sync GitHub release notes"
          git push origin HEAD:master
