name: Sync ecosystem release tracker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ecosystem-release]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: ecosystem-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
      - name: Verify refresh behavior
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/app" -w /app
          python:3.12.10-slim@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db
          python -m unittest scripts.release_tracking.test_publish_snapshot -v
      - name: Collect the complete repository roster
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e GITHUB_TOKEN -v "$PWD:/app" -w /app
          python:3.12.10-slim@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db
          python scripts/release_tracking/when_repositories_are_checked_then_publish_snapshot.py
      - name: Publish the successful check
        run: |
          git config user.name "Seth Tucker"
          git config user.email "crimsonknightstudios@gmail.com"
          git add config/github_releases.json public/release-tracker
          bundle=$(readlink public/release-tracker/current)
          git ls-files --error-unmatch \
            "public/release-tracker/$bundle/snapshot.json" \
            "public/release-tracker/$bundle/snapshot.js" \
            "public/release-tracker/$bundle/index.html" \
            "public/release-tracker/$bundle/manifest.json" >/dev/null
          if git diff --cached --quiet; then
            echo "The complete snapshot is current."
            exit 0
          fi
          git commit -m "docs: refresh ecosystem release evidence"
          git push origin HEAD:master
