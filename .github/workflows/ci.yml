name: CI
on:
  pull_request:
  push:
    branches: [master, release/next]
    # A release tag (RELEASING.md) builds, tests and publishes the bundle that
    # scripts/deploy_droplet.sh deploys. Only tags deploy.
    tags: ["site-*"]
permissions:
  contents: read
jobs:
  test:
    name: Verify the application and deployment image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release snapshot behavior
        run: >-
          docker run --rm -v "$PWD:/app" -w /app
          python:3.12.10-slim@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db
          python -m unittest scripts.release_tracking.test_publish_snapshot -v
      - name: Build the pinned application
        run: docker build --target builder --tag amberframework-builder:test .
      - name: Exercise application and documentation behavior
        run: |
          docker run --rm amberframework-builder:test sh -c 'crystal-alpha spec && scripts/check_v2_preview.sh && scripts/check_v2_site_launch.sh && scripts/check_v2_beta_docs.sh'
      - name: Build the deployment image
        run: docker build --tag amberframework-site:test .
      - name: Exercise public routes in the deployment image
        run: |
          docker run --detach --name amber-site --publish 3212:3000 amberframework-site:test
          trap 'docker logs amber-site; docker rm --force amber-site' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3212/ >/dev/null; then break; fi
            sleep 1
          done
          for path in / /pioneers /pioneers.md /pioneers.json /roadmap /research /release-tracker /release-tracker.json /docs/v2/knowledge.md; do
            curl --fail --silent --show-error "http://127.0.0.1:3212$path" >/dev/null
          done
          curl --fail --silent http://127.0.0.1:3212/pioneers | grep -F 'amber-pioneers-crystal-trail-v1-'
      # The droplet (agentc-agency-01) never compiles. It runs this exact image's /app,
      # shipped by scripts/deploy_droplet.sh, which checks both sha256 values below
      # on the operator's machine and again on the server before `current` moves.
      - name: Export the droplet bundle from the deployment image
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
        run: |
          set -euo pipefail
          container=$(docker create amberframework-site:test)
          mkdir bundle
          docker cp "$container:/app/." bundle/
          docker rm "$container"
          docker run --rm --entrypoint ldd amberframework-site:test /app/bin/amberframework | tee bundle-ldd.txt
          if grep -q 'not found' bundle-ldd.txt; then echo "binary has an unresolved library" >&2; exit 1; fi
          tar -czf amberframework-bundle.tar.gz -C bundle .
          base_image=$(sed -n 's/^FROM \([^ ]*\) AS production$/\1/p' Dockerfile)
          jq -n \
            --arg git_sha "$SOURCE_SHA" \
            --arg git_ref "$SOURCE_REF" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg base_image "$base_image" \
            --arg binary_sha256 "$(sha256sum bundle/bin/amberframework | cut -d' ' -f1)" \
            --arg bundle_sha256 "$(sha256sum amberframework-bundle.tar.gz | cut -d' ' -f1)" \
            --arg shard_lock_sha256 "$(sha256sum shard.lock | cut -d' ' -f1)" \
            --arg linked_libraries "$(awk '{print $1}' bundle-ldd.txt | sort -u | paste -sd' ' -)" \
            '$ARGS.named' > release-manifest.json
          cat release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amberframework-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            amberframework-bundle.tar.gz
            release-manifest.json
          if-no-files-found: error
          # Tag builds are kept long enough to roll back to; the GitHub Release
          # published below keeps them for good.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/site-') && 90 || 30 }}

  # On a release tag, publish the tested bundle as the tag's GitHub Release with
  # SHA256SUMS, the manifest, and the commit hash and sha256 values in the notes.
  # This is the only source scripts/deploy_droplet.sh deploys from.
  release:
    name: Publish the tagged site release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/site-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: amberframework-${{ github.sha }}
          path: release
      - name: Check the bundle against its manifest and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: release
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^site-[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "$TAG is not a site-YYYY.MM.N tag" >&2; exit 1; }
          [[ "$(jq -r .git_sha release-manifest.json)" == "$GITHUB_SHA" ]] || { echo "manifest commit differs" >&2; exit 1; }
          [[ "$(jq -r .git_ref release-manifest.json)" == "$GITHUB_REF" ]] || { echo "manifest ref differs" >&2; exit 1; }
          bundle_sha256=$(sha256sum amberframework-bundle.tar.gz | cut -d' ' -f1)
          [[ "$bundle_sha256" == "$(jq -r .bundle_sha256 release-manifest.json)" ]] || { echo "bundle sha256 differs" >&2; exit 1; }
          sha256sum amberframework-bundle.tar.gz release-manifest.json > SHA256SUMS
          {
            echo "amberframework.org site release \`$TAG\`."
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Bundle sha256 (amberframework-bundle.tar.gz): \`$bundle_sha256\`"
            echo "- Binary sha256 (bin/amberframework): \`$(jq -r .binary_sha256 release-manifest.json)\`"
            echo "- Built and tested by CI run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Deploy with \`scripts/deploy_droplet.sh $TAG\`. See RELEASING.md."
          } > notes.md
          prerelease=()
          [[ "$TAG" =~ ^site-[0-9.]+$ ]] || prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file notes.md ${prerelease[@]+"${prerelease[@]}"} \
            amberframework-bundle.tar.gz release-manifest.json SHA256SUMS
