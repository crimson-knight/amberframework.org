name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    name: Verify the application and deployment image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release snapshot behavior
        run: >-
          docker run --rm -v "$PWD:/app" -w /app
          python:3.12.10-slim@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db
          python -m unittest scripts.release_tracking.test_publish_snapshot -v
      - name: Build the pinned application
        run: docker build --target builder --tag amberframework-builder:test .
      - name: Exercise application and documentation behavior
        run: |
          docker run --rm amberframework-builder:test sh -c 'crystal-alpha spec && scripts/check_v2_preview.sh && scripts/check_v2_site_launch.sh && scripts/check_v2_beta_docs.sh'
      - name: Build the deployment image
        run: docker build --tag amberframework-site:test .
      - name: Exercise public routes in the deployment image
        run: |
          docker run --detach --name amber-site --publish 3212:3000 amberframework-site:test
          trap 'docker logs amber-site; docker rm --force amber-site' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3212/ >/dev/null; then break; fi
            sleep 1
          done
          for path in / /pioneers /pioneers.md /pioneers.json /roadmap /research /release-tracker /release-tracker.json /docs/v2/knowledge.md; do
            curl --fail --silent --show-error "http://127.0.0.1:3212$path" >/dev/null
          done
          curl --fail --silent http://127.0.0.1:3212/pioneers | grep -F 'amber-pioneers-crystal-trail-v1-'
          docker run --rm --network host --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --cpus 1 --pids-limit 64 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/app:ro" -w /app \
            python:3.12.10-slim@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db \
            python scripts/check_memory_contract_guide.py --base-url http://127.0.0.1:3212 --self-test
