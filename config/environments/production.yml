name: amberframework.org

server:
  host: 0.0.0.0
  port: 3000
  secret_key_base: amberframework-production-overridden-by-environment

logging:
  severity: info
  colorize: false
  filter:
    - password
    - confirm_password
  skip: []
  context:
    - request

pipes:
  static:
    headers:
      "Cache-Control": "public, max-age=3600"
